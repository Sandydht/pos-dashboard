<div
  class="w-full h-auto min-h-screen flex flex-col items-center justify-start bg-[var(--color-quaternary-50)]"
>
  <div class="w-full h-auto flex flex-col items-center justify-start gap-4 bg-white p-[25px]">
    <div class="w-full h-auto flex items-center justify-between gap-2 max-w-[650px]">
      <div class="w-auto h-auto">
        <img
          src="assets/images/webp/flexpos-logo.webp"
          alt="Flexpos logo"
          class="w-full h-auto max-w-[150px] md:max-w-[200px]"
        />
      </div>

      <div class="w-auto h-auto">
        <p
          class="text-left text-[12px] leading-[16px] md:text-[14px] md:leading-[20px] text-[var(--color-tertiary-500)] font-semibold"
        >
          Step 3 of 4
        </p>
      </div>
    </div>

    <div class="w-full h-auto flex items-end justify-between gap-2 max-w-[650px]">
      <div class="w-full h-auto flex flex-col items-center justify-center gap-1">
        <p class="text-center text-[12px] leading-[16px] md:text-[14px] md:leading-[20px]">
          Register Account
        </p>

        <div
          class="w-full h-full min-h-[6px] max-h-[6px] rounded-full bg-[var(--color-primary-500)]"
        ></div>
      </div>

      <div class="w-full h-auto flex flex-col items-center justify-center gap-1">
        <p class="text-center text-[12px] leading-[16px] md:text-[14px] md:leading-[20px]">
          Store Setup
        </p>

        <div
          class="w-full h-full min-h-[6px] max-h-[6px] rounded-full bg-[var(--color-primary-500)]"
        ></div>
      </div>

      <div class="w-full h-auto flex flex-col items-center justify-center gap-1">
        <p class="text-center text-[12px] leading-[16px] md:text-[14px] md:leading-[20px]">
          Outlet Setup
        </p>

        <div
          class="w-full h-full min-h-[6px] max-h-[6px] rounded-full bg-[var(--color-primary-500)]"
        ></div>
      </div>

      <div class="w-full h-auto flex flex-col items-center justify-center gap-1">
        <p class="text-center text-[12px] leading-[16px] md:text-[14px] md:leading-[20px]">
          Product Setup
        </p>

        <div
          class="w-full h-full min-h-[6px] max-h-[6px] rounded-full bg-[var(--color-quaternary-200)]"
        ></div>
      </div>
    </div>
  </div>

  <form class="w-full h-auto p-[25px] flex flex-col items-start justify-center gap-4 max-w-[650px]">
    <div class="w-full h-auto flex flex-col items-start justify-start">
      <p
        class="text-left text-[14px] leading-[20px] md:text-[16px] md:leading-[24px] font-semibold"
      >
        Setup your Outlet
      </p>

      <p
        class="text-left text-[12px] leading-[16px] md:text-[14px] md:leading-[20px] text-[var(--color-text-secondary)]"
      >
        Tell us where your physical sales happen.
      </p>
    </div>

    <div class="w-full h-auto flex flex-col items-start justify-start gap-2">
      <div class="w-full h-auto">
        <app-input
          id="outletCode"
          label="Code"
          placeholder="e.g. KOPI-KENANGAN"
          [required]="true"
        ></app-input>
      </div>

      <div class="w-full h-auto">
        <app-input
          id="outletName"
          label="Name"
          placeholder="e.g. Kopi Kenangan"
          [required]="true"
        ></app-input>
      </div>

      <div class="w-full h-auto">
        <app-input
          id="email"
          label="Email"
          placeholder="e.g. example@email.com"
          [required]="true"
        ></app-input>
      </div>

      <div class="w-full h-auto">
        <app-input
          id="phoneNumber"
          label="Phone Number"
          placeholder="e.g. +6281123123123"
          [required]="true"
        ></app-input>
      </div>

      <div class="w-full h-auto">
        <app-input
          id="country"
          label="Country"
          placeholder="e.g. Indonesia"
          [required]="true"
        ></app-input>
      </div>

      <div class="w-full h-auto">
        <app-input
          id="province"
          label="Province"
          placeholder="e.g. DKI Jakarta"
          [required]="true"
        ></app-input>
      </div>

      <div class="w-full h-auto">
        <app-input
          id="city"
          label="City"
          placeholder="e.g. Jakarta Selatan"
          [required]="true"
        ></app-input>
      </div>

      <div class="w-full h-auto">
        <app-input
          id="postalCode"
          label="Postal Code"
          placeholder="e.g. 12345"
          [required]="true"
        ></app-input>
      </div>

      <div class="w-full h-auto">
        <app-textarea
          id="address"
          label="Address"
          placeholder="e.g. Jl. Mendawai, Jakarta Selatan"
          [required]="true"
        ></app-textarea>
      </div>
    </div>

    <div class="w-full h-auto flex flex-col items-center justify-center gap-4">
      <div class="w-full h-auto px-4 flex flex-col items-start justify-start gap-2">
        <div class="w-full h-auto">
          <app-button type="submit" variant="primary"> Save & Continue </app-button>
        </div>

        <div class="w-full h-auto">
          <app-button type="submit" variant="outline-primary"> Back </app-button>
        </div>
      </div>

      <div class="w-auto h-auto flex items-center justify-center gap-1">
        <img
          src="assets/images/svg/lock_24px_tertiary_500.svg"
          alt="Lock icon"
          class="w-full h-full min-w-[16px] max-w-[16px] min-h-[16px] max-h-[16px] object-contain object-center"
        />

        <p class="text-center text-[12px] leading-[16px] text-[var(--color-tertiary-500)]">
          Your business information is securely stored.
        </p>
      </div>
    </div>
  </form>
</div>
