@if (!fetchGetOutletDetailLoading()) {
  <div
    class="w-full h-auto min-h-screen flex flex-col items-center justify-start bg-[var(--color-quaternary-50)]"
  >
    <div class="w-full h-auto">
      <app-step-header selectedStep="setup-outlet"></app-step-header>
    </div>

    <form
      class="w-full h-auto p-[25px] flex flex-col items-start justify-center gap-4 max-w-lg"
      [formGroup]="setupOutletForm"
      (ngSubmit)="onSubmit()"
    >
      <div class="w-full h-auto flex flex-col items-start justify-start">
        <p
          class="text-left text-[14px] leading-[20px] md:text-[16px] md:leading-[24px] font-semibold"
        >
          Setup your Outlet
        </p>

        <p
          class="text-left text-[12px] leading-[16px] md:text-[14px] md:leading-[20px] text-[var(--color-text-secondary)]"
        >
          Tell us where your physical sales happen.
        </p>
      </div>

      <div class="w-full h-auto flex flex-col items-start justify-start gap-2">
        <div class="w-full h-auto">
          <app-input
            id="outletCode"
            label="Code"
            placeholder="e.g. KOPI-KENANGAN"
            [required]="true"
            formControlName="outletCode"
            [error]="outletCodeError"
          ></app-input>
        </div>

        <div class="w-full h-auto">
          <app-input
            id="outletName"
            label="Name"
            placeholder="e.g. Kopi Kenangan"
            [required]="true"
            formControlName="outletName"
            [error]="outletNameError"
          ></app-input>
        </div>

        <div class="w-full h-auto">
          <app-input
            id="email"
            label="Email"
            placeholder="e.g. example@email.com"
            [required]="true"
            formControlName="outletEmail"
            [error]="outletEmailError"
          ></app-input>
        </div>

        <div class="w-full h-auto">
          <app-input
            id="phoneNumber"
            label="Phone Number"
            placeholder="e.g. +6281123123123"
            [required]="true"
            formControlName="outletPhoneNumber"
            [error]="outletPhoneNumberError"
          ></app-input>
        </div>

        <div class="w-full h-auto">
          <app-input-dropdown
            id="outletCountry"
            label="Country"
            placeholder="Choose Country"
            [required]="true"
            formControlName="outletCountry"
            [options]="countriesOption()"
            [error]="outletCountryError"
          ></app-input-dropdown>
        </div>

        <div class="w-full h-auto">
          <app-input-dropdown
            id="outletProvince"
            label="Province"
            placeholder="Choose Province"
            [required]="true"
            formControlName="outletProvince"
            [options]="provincesOption()"
            [hasMore]="paginationMetaProvinces().hasNextPage"
            [isLoadingMore]="fetchProvincesOptionLoading()"
            searchPlaceholder="Search Province..."
            [enableSearch]="true"
            (search)="handleProvinceSearch($event)"
            (loadMore)="loadMoreProvincesOption()"
            [error]="outletProvinceError"
          ></app-input-dropdown>
        </div>

        <div class="w-full h-auto">
          <app-input-dropdown
            id="outletCity"
            label="City"
            placeholder="Choose City"
            [required]="true"
            formControlName="outletCity"
            [options]="citiesOption()"
            [hasMore]="paginationMetaCities().hasNextPage"
            [isLoadingMore]="fetchCitiesOptionLoading()"
            searchPlaceholder="Search City..."
            [enableSearch]="true"
            (search)="handleCitySearch($event)"
            (loadMore)="loadMoreCitiesOption()"
            [error]="outletCityError"
          ></app-input-dropdown>
        </div>

        <div class="w-full h-auto">
          <app-input
            id="outletPostalCode"
            label="Postal Code"
            placeholder="e.g. 12345"
            [required]="true"
            formControlName="outletPostalCode"
            [error]="outletPostalCodeError"
          ></app-input>
        </div>

        <div class="w-full h-auto">
          <app-textarea
            id="outletAddress"
            label="Address"
            placeholder="e.g. Jl. Mendawai, Jakarta Selatan"
            [required]="true"
            formControlName="outletAddress"
            [error]="outletAddressError"
          ></app-textarea>
        </div>

        <div class="w-full h-auto">
          <app-input-opening-hours
            id="outletOpeningHours"
            label="Opening Hours"
            [required]="true"
            formControlName="outletOpeningHours"
          ></app-input-opening-hours>
        </div>
      </div>

      <div class="w-full h-auto flex flex-col items-center justify-center gap-4">
        <div class="w-full h-auto px-4 flex flex-col items-start justify-start gap-2">
          <div class="w-full h-auto">
            <app-button
              type="submit"
              variant="primary"
              [disabled]="setupOutletForm.invalid || submitSetupOutletLoading()"
              [loading]="submitSetupOutletLoading()"
            >
              Save & Continue
            </app-button>
          </div>

          <div class="w-full h-auto">
            <app-button type="button" variant="outline-primary" (click)="goToSetupStorePage()">
              Back
            </app-button>
          </div>
        </div>

        <div class="w-auto h-auto flex items-center justify-center gap-1">
          <img
            src="assets/images/svg/lock_24px_tertiary_500.svg"
            alt="Lock icon"
            class="w-full h-full min-w-[16px] max-w-[16px] min-h-[16px] max-h-[16px] object-contain object-center"
          />

          <p class="text-center text-[12px] leading-[16px] text-[var(--color-tertiary-500)]">
            Your business information is securely stored.
          </p>
        </div>
      </div>
    </form>
  </div>
}
