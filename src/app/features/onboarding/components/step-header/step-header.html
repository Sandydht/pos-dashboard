<div
  class="w-full h-auto flex flex-col items-center justify-start gap-4 bg-white p-[25px] sticky top-0 z-40"
>
  <div class="w-full h-auto flex items-center justify-between gap-2 max-w-[650px]">
    <div class="w-auto h-auto">
      <img
        src="assets/images/webp/flexpos-logo.webp"
        alt="Flexpos logo"
        class="w-full h-auto max-w-[150px] md:max-w-[200px]"
      />
    </div>

    <div class="w-auto h-auto">
      <p
        class="text-left text-[12px] leading-[16px] md:text-[14px] md:leading-[20px] text-[var(--color-tertiary-500)] font-semibold"
      >
        Step {{ currentIndex() + 1 }} of {{ datas().length }}
      </p>
    </div>
  </div>

  <div class="w-full h-auto flex items-end justify-between gap-2 max-w-[650px]">
    @for (data of datas(); track $index) {
      <div class="w-full h-auto flex flex-col items-center justify-center gap-1">
        <p class="text-center text-[12px] leading-[16px] md:text-[14px] md:leading-[20px]">
          {{ data.label }}
        </p>

        <div
          class="w-full h-full min-h-[6px] max-h-[6px] rounded-full"
          [ngClass]="{
            'bg-[var(--color-primary-500)]': data.isComplete,
            'bg-[var(--color-quaternary-200)]': !data.isComplete,
          }"
        ></div>
      </div>
    }
  </div>
</div>
