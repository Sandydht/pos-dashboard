<div class="w-full h-auto flex flex-col items-center justify-start py-10 px-[25px] gap-10">
  <div class="w-auto h-auto max-w-lg">
    <img
      src="assets/images/webp/flexpos-logo.webp"
      alt="Flexpos logo"
      class="w-full h-auto object-contain object-center max-w-[250px]"
    />
  </div>

  <form
    class="w-full h-auto flex flex-col items-center justify-start gap-6 max-w-lg"
    [formGroup]="loginForm"
    (ngSubmit)="onSubmit()"
  >
    <div class="w-full h-auto">
      <p class="text-center text-[22px] leading-[28px] font-semibold">Welcome Back!</p>
    </div>

    <div class="w-full h-auto flex flex-col items-start justify-start gap-4">
      <div class="w-full h-auto">
        <app-input
          id="email"
          label="Email"
          placeholder="Email..."
          [required]="true"
          type="email"
          formControlName="email"
          [error]="emailError"
        ></app-input>
      </div>

      <div class="w-full h-auto">
        <app-input-password
          id="password"
          label="Password"
          placeholder="Password..."
          [required]="true"
          formControlName="password"
          [error]="passwordError"
        ></app-input-password>
      </div>

      <div class="w-full h-auto flex flex-col items-start justify-start gap-1">
        <div class="w-auto h-auto">
          <label
            id="rememberMe"
            class="text-left text-[12px] leading-[16px] font-semibold text-black flex items-center justify-start gap-2"
          >
            <input type="checkbox" />
            Remember Me
          </label>
        </div>

        <div class="w-full h-auto">
          <a
            routerLink="/login"
            class="text-left text-[12px] leading-[16px] text-[var(--color-info)] hover:underline"
          >
            Forgot Password?
          </a>
        </div>
      </div>
    </div>

    <div class="w-full h-auto flex flex-col items-center justify-center gap-4">
      <div class="w-full h-auto px-4">
        <app-button
          type="submit"
          variant="primary"
          [disabled]="loginForm.invalid || submitLoginLoading()"
          [loading]="submitLoginLoading()"
        >
          Log In
        </app-button>
      </div>

      <div class="w-full h-auto">
        <p class="text-center text-[12px] leading-[16px]">
          Don't have your account?
          <a routerLink="/register" class="text-[var(--color-info)] hover:underline">Register</a>
        </p>
      </div>
    </div>
  </form>
</div>
