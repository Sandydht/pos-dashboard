<div class="w-full h-auto flex items-start justify-start bg-[var(--color-quaternary-50)]">
  <p>Test</p>

  <div class="w-full h-auto flex flex-col items-start justify-start"></div>
</div>

<div class="mt-10 min-h-screen flex bg-[var(--color-quaternary-50)]">
  <div
    class="hidden lg:flex w-1/3 bg-[var(--color-primary-500)] p-12 flex-col justify-between text-white"
  >
    <div>
      <img src="logo-flexpos-white.svg" alt="FlexPos Logo" class="h-10" />
      <h2 class="mt-20 text-3xl font-bold leading-tight">
        Satu langkah lagi untuk memajukan bisnismu.
      </h2>
      <p class="mt-4 text-[var(--color-primary-100)]">
        Atur detail tokomu sekarang dan nikmati kemudahan pengelolaan transaksi dalam satu
        dashboard.
      </p>
    </div>
    <div class="text-sm text-[var(--color-primary-200)]">
      &copy; 2026 FlexPos Smart Retail Solutions.
    </div>
  </div>

  <div class="flex-1 flex items-center justify-center p-8">
    <div class="max-w-md w-full">
      <div class="flex items-center space-x-4 mb-10">
        <div class="flex items-center text-[var(--color-primary-500)]">
          <span
            class="w-8 h-8 rounded-full bg-[var(--color-primary-100)] flex items-center justify-center font-bold text-sm"
            >1</span
          >
          <span class="ml-2 font-medium">Buat Akun</span>
        </div>
        <div class="h-[2px] w-12 bg-[var(--color-primary-500)]"></div>
        <div class="flex items-center text-[var(--color-primary-500)]">
          <span
            class="w-8 h-8 rounded-full bg-[var(--color-primary-500)] text-white flex items-center justify-center font-bold text-sm"
            >2</span
          >
          <span class="ml-2 font-bold">Setup Toko</span>
        </div>
      </div>

      <h1 class="text-[var(--text-3xl)] font-bold text-[var(--color-text-primary)]">
        Siapkan Toko Anda
      </h1>
      <p class="text-[var(--color-text-secondary)] mt-2">
        Isi informasi dasar toko untuk menyesuaikan fitur dashboard.
      </p>

      <form class="mt-8 space-y-6">
        <div>
          <label class="block text-sm font-medium text-[var(--color-text-secondary)]"
            >Nama Toko</label
          >
          <input
            type="text"
            placeholder="Contoh: Kedai Kopi Flex"
            class="mt-1 block w-full px-4 py-3 border-[var(--color-quaternary-200)] border rounded-lg focus:ring-[var(--state-focus-ring)] focus:border-[var(--color-primary-500)] outline-none transition-all"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-[var(--color-text-secondary)]"
            >Kategori Bisnis</label
          >
          <select
            class="mt-1 block w-full px-4 py-3 border-[var(--color-quaternary-200)] border rounded-lg focus:border-[var(--color-primary-500)] outline-none"
          >
            <option>Retail / Toko Klontong</option>
            <option>F&B (Cafe/Resto)</option>
            <option>Jasa (Laundry/Barbershop)</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-[var(--color-text-secondary)]"
            >Alamat Lengkap</label
          >
          <textarea
            rows="3"
            placeholder="Jl. Sudirman No. 123..."
            class="mt-1 block w-full px-4 py-3 border-[var(--color-quaternary-200)] border rounded-lg focus:border-[var(--color-primary-500)] outline-none"
          ></textarea>
        </div>

        <button
          type="submit"
          class="w-full bg-[var(--color-secondary-500)] hover:bg-[var(--color-secondary-600)] text-[var(--color-primary-500)] font-bold py-3 rounded-lg shadow-[var(--shadow-md)] transition-all transform active:scale-[0.98]"
        >
          Buka Dashboard Saya
        </button>
      </form>
    </div>
  </div>
</div>
