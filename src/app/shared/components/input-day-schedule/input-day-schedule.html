<div
  class="w-full h-auto flex flex-col items-start justify-start md:flex-row md:items-center md:justify-between gap-1.5"
>
  <label
    [htmlFor]="id()"
    class="w-auto h-auto text-left text-[12px] leading-[16px] font-semibold text-black"
  >
    {{ label() }}
  </label>

  <div class="w-full md:w-auto h-auto flex items-center justify-start gap-1 md:gap-2">
    <div class="w-auto h-auto">
      <app-toggle-switch
        [disabled]="isDisabled()"
        [ngModel]="internalValue().isClosed"
        (ngModelChange)="handleClosedChange($event)"
      ></app-toggle-switch>
    </div>
    <div class="w-auto h-auto">
      <app-input-time
        [disabled]="isDisabled() || internalValue().isClosed"
        [ngModel]="internalValue().open"
        (ngModelChange)="handleOpenChange($event)"
      ></app-input-time>
    </div>
    <div class="w-auto h-auto">
      <app-input-time
        [disabled]="isDisabled() || internalValue().isClosed"
        [ngModel]="internalValue().close"
        (ngModelChange)="handleCloseChange($event)"
      ></app-input-time>
    </div>
  </div>
</div>
